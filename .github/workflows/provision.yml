name: Provision Cloudflare resources

# One-time (idempotent) setup, run by hand:
#   gh workflow run provision.yml
#
# Order matters here. The Pages project and the custom domain come FIRST, because they are
# what gets the site publicly visible. The storage resources come after and are allowed to
# fail: an API token scoped only to Pages is a perfectly reasonable starting point, and a
# missing D1 binding degrades the API routes rather than the whole site.
#
# The summary at the end lists exactly which token permissions are missing, if any.
# Re-running is safe: every step tolerates "already exists".

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name
        default: lyme
        required: true
      custom_domain:
        description: Custom domain to attach (blank to skip)
        default: knowlyme.com
        required: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional

      - name: Resolve the account
        id: account
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "id=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
            echo "Using CLOUDFLARE_ACCOUNT_ID from repository secrets."
            exit 0
          fi
          resp=$(curl -sS https://api.cloudflare.com/client/v4/accounts \
                   -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          count=$(echo "$resp" | jq '.result | length')
          if [ "$count" != "1" ]; then
            echo "::error::Found $count accounts for this token. Add a CLOUDFLARE_ACCOUNT_ID repository secret."
            echo "$resp" | jq -r '.result[]? | "  \(.id)  \(.name)"'
            exit 1
          fi
          echo "id=$(echo "$resp" | jq -r '.result[0].id')" >> "$GITHUB_OUTPUT"
          echo "Account: $(echo "$resp" | jq -r '.result[0].name')"

      - name: Probe what this token is allowed to do
        id: probe
        env:
          ACCT: ${{ steps.account.outputs.id }}
        run: |
          set -uo pipefail
          probe () {  # name, path
            code=$(curl -sS -o /tmp/p.json -w '%{http_code}' \
                     "https://api.cloudflare.com/client/v4/accounts/$ACCT/$2" \
                     -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            ok=$(jq -r '.success // false' /tmp/p.json 2>/dev/null || echo false)
            if [ "$code" = "200" ] && [ "$ok" = "true" ]; then
              echo "  OK       $1"; echo "$1=yes" >> "$GITHUB_OUTPUT"
            else
              echo "  MISSING  $1  (HTTP $code)"; echo "$1=no" >> "$GITHUB_OUTPUT"
            fi
          }
          # NOTE: these are READ probes. A token can pass one and still fail to create the
          # resource, because Cloudflare splits Read and Edit into separate permissions.
          # The create steps below report that distinction when it bites.
          echo "Token read access:"
          probe pages   "pages/projects"
          probe d1      "d1/database"
          probe kv      "storage/kv/namespaces"
          probe r2      "r2/buckets"
          probe workers "workers/scripts"

      # ---- critical path: get the site publicly visible -----------------------

      - name: Create the Pages project
        if: steps.probe.outputs.pages == 'yes'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          npx wrangler pages project create "${{ inputs.project_name }}" \
            --production-branch=main || echo "project already exists"

      - name: Attach the custom domain
        id: domain
        if: ${{ steps.probe.outputs.pages == 'yes' && inputs.custom_domain != '' }}
        env:
          ACCT: ${{ steps.account.outputs.id }}
        run: |
          set -uo pipefail
          out=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/${{ inputs.project_name }}/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"${{ inputs.custom_domain }}"}')
          echo "$out" | jq '{success, errors, name: .result.name, status: .result.status}'
          if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
            echo "attached=yes" >> "$GITHUB_OUTPUT"
          elif echo "$out" | jq -e '.errors[]? | select(.message|test("already"; "i"))' >/dev/null; then
            echo "attached=yes" >> "$GITHUB_OUTPUT"
            echo "Domain was already attached."
          else
            echo "attached=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not attach ${{ inputs.custom_domain }} — see the response above."
          fi

      # ---- storage: nice to have, allowed to fail -----------------------------

      - name: Create the D1 database
        id: d1
        if: steps.probe.outputs.d1 == 'yes'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          set -uo pipefail
          npx wrangler d1 create lyme-db 2>&1 | tee /tmp/d1.log || true
          id=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[]? | select(.name=="lyme-db") | .uuid')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            if grep -qi "Authentication error" /tmp/d1.log; then
              echo "::warning::The API token can READ D1 but not create databases. Add 'Account / D1 -> Edit' to the token and re-run."
            else
              echo "::warning::could not resolve lyme-db id"
            fi
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "D1 lyme-db: $id"

      - name: Create the KV namespace
        id: kv
        if: steps.probe.outputs.kv == 'yes'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          set -uo pipefail
          npx wrangler kv namespace create KV 2>&1 | tee /tmp/kv.log || true
          id=$(npx wrangler kv namespace list 2>/dev/null | jq -r '.[]? | select(.title|test("KV$")) | .id' | head -1)
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::warning::could not resolve the KV id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "KV: $id"

      - name: Create the R2 bucket
        if: steps.probe.outputs.r2 == 'yes'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: npx wrangler r2 bucket create lyme-story-media || echo "bucket already exists"

      - name: Apply the database schema
        if: steps.d1.outputs.id != ''
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          # schema.sql is IF NOT EXISTS throughout, so repeating this is safe.
          sed -i "s|REPLACE_WITH_ID_FROM_wrangler_d1_create|${{ steps.d1.outputs.id }}|" wrangler.toml
          npx wrangler d1 execute lyme-db --remote --file=./schema.sql

      # ------------------------------------------------------------------------

      # Values are passed in through env rather than interpolated into the shell, so the
      # markdown never has to survive GitHub's expression parser and a quote in a status
      # string cannot break the workflow file.
      - name: Summary
        if: always()
        env:
          ACCT: ${{ steps.account.outputs.id }}
          PROJECT: ${{ inputs.project_name }}
          DOMAIN: ${{ inputs.custom_domain }}
          DOMAIN_OK: ${{ steps.domain.outputs.attached }}
          P_PAGES: ${{ steps.probe.outputs.pages }}
          P_D1: ${{ steps.probe.outputs.d1 }}
          P_KV: ${{ steps.probe.outputs.kv }}
          P_R2: ${{ steps.probe.outputs.r2 }}
          P_WORKERS: ${{ steps.probe.outputs.workers }}
          D1_ID: ${{ steps.d1.outputs.id }}
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          status () { [ "$1" = "yes" ] && echo "ok" || echo "**token lacks $2**"; }
          {
            echo "## Provisioning result"
            echo
            echo '| Resource | Status | Value to commit |'
            echo '|---|---|---|'
            echo "| Account ID | found | \`$ACCT\` |"
            echo "| Pages project \`$PROJECT\` | $(status "$P_PAGES" 'Pages:Edit') | — |"
            echo "| Custom domain | $([ "$DOMAIN_OK" = yes ] && echo attached || echo 'not attached') | \`$DOMAIN\` |"
            echo "| D1 \`lyme-db\` | $(status "$P_D1" 'D1:Edit') | \`${D1_ID:-—}\` |"
            echo "| KV | $(status "$P_KV" 'Workers KV Storage:Edit') | \`${KV_ID:-—}\` |"
            echo "| R2 bucket | $(status "$P_R2" 'Workers R2 Storage:Edit') | \`lyme-story-media\` |"
            echo "| Workers (cron) | $(status "$P_WORKERS" 'Workers Scripts:Edit') | — |"
            echo
            if [ "$P_D1" != yes ] || [ "$P_KV" != yes ] || [ "$P_R2" != yes ]; then
              echo "### Token permissions to add"
              echo
              echo "Cloudflare dashboard -> My Profile -> API Tokens -> edit the token used here, add:"
              echo
              echo '- **Account / D1** -> Edit'
              echo '- **Account / Workers KV Storage** -> Edit'
              echo '- **Account / Workers R2 Storage** -> Edit'
              echo '- **Account / Workers Scripts** -> Edit  (only needed for the cron worker)'
              echo
              echo "Then re-run this workflow. The static site builds and deploys without them;"
              echo "the petition, stories and news APIs need D1 and KV."
            else
              echo "All resources present. Paste the IDs above into \`wrangler.toml\` **and**"
              echo "\`worker/wrangler.toml\`, then commit. They are identifiers, not secrets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
