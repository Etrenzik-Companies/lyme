name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The OG share images are generated locally and committed, so CI never needs a
      # font stack or a rasterizer. See scripts/make-og.mjs.
      - name: Install
        run: npm ci --omit=optional

      - name: Build
        run: npm run build
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Check the build produced the tracker
        run: |
          test -f dist/index.html
          test -f dist/data/cdc-lyme.json
          grep -q 'class="chart-svg"' dist/index.html
          echo "tracker rendered server-side: ok"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lyme --branch=main
