name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The OG share images are generated locally and committed, so CI never needs a
      # font stack or a rasterizer. See scripts/make-og.mjs.
      - name: Install
        run: npm ci --omit=optional

      - name: Build
        run: npm run build
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # A broken data pipeline should fail the build, not ship an empty tracker.
      - name: Verify the build
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/data/cdc-lyme.json
          grep -q 'class="c-line"' dist/index.html
          grep -q '89,468'          dist/index.html
          grep -q 'case definition' dist/index.html
          test -f dist/assets/og/tracker.png
          echo "tracker rendered server-side with annotations: ok"

      - name: Warn if the D1 binding is still a placeholder
        run: |
          if grep -q 'REPLACE_WITH_ID' wrangler.toml; then
            echo "::warning::wrangler.toml still has placeholder resource IDs — the static site will deploy but every API route will fail. Run the 'Provision Cloudflare resources' workflow, then commit the IDs it prints."
          fi

      - name: Resolve the account
        id: account
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "id=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_OUTPUT"; exit 0
          fi
          resp=$(curl -sS https://api.cloudflare.com/client/v4/accounts \
                   -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          count=$(echo "$resp" | jq '.result | length')
          if [ "$count" != "1" ]; then
            echo "::error::Token sees $count accounts; add a CLOUDFLARE_ACCOUNT_ID secret."; exit 1
          fi
          echo "id=$(echo "$resp" | jq -r '.result[0].id')" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=lyme \
            --branch=main \
            --commit-dirty=true
